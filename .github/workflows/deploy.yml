name: Deploy rapport
run-name: Deploy ${{ github.event.repository.name }} → ${{ github.ref_name == 'publicera-intern' && 'intern' || 'publik' }}

on:
  push:
    branches: [ publicera-publik, publicera-intern ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on:
      - self-hosted
      - ${{ github.ref == 'refs/heads/publicera-intern' && 'rapport-intern' || 'rapport' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Visa vilken server som deploy:as till
        run: |
          if [ "$GITHUB_REF" = "refs/heads/publicera-intern" ]; then
            echo "Deploy till INTERN server (${{ github.event.repository.name }})"
          else
            echo "Deploy till PUBLIK server (${{ github.event.repository.name }})"
          fi

      - name: Förbered publiceringsmapp
        run: |
          REPO_NAMN="${{ github.event.repository.name }}"
          if [ -f ".rapport_deploy_namn" ]; then
            REPO_NAMN="$(cat .rapport_deploy_namn | tr -d '[:space:]')"
            echo "Anvander override-namn fran .rapport_deploy_namn: $REPO_NAMN"
          fi

          KALLFIL="${REPO_NAMN}.html"

          if [ ! -f "$KALLFIL" ]; then
            echo "FEL: Hittar inte $KALLFIL i repo-roten." >&2
            exit 1
          fi

          mkdir -p _publish
          cp "$KALLFIL" _publish/index.html

          # Underrapporter (t.ex. en sida per kommun) ligger i mappen underrapporter/ och hamnar under
          # rapportens adress. De får inget eget kort på landningssidan.
          if [ -d "underrapporter" ]; then
            cp -r underrapporter _publish/underrapporter
          fi
          echo "$REPO_NAMN" > _publish/.repo_namn_anvant

      - name: Deploy rapport using server-side script
        run: |
          REPO_NAMN="$(cat _publish/.repo_namn_anvant)"
          /usr/local/bin/rapport_deploy_repo.sh "$(pwd)/_publish" "$REPO_NAMN"

      - name: Regenerera landningssida
        run: |
          sudo -u shiny /usr/local/bin/generera_landningssida.sh || echo "Varning: kunde inte regenerera landningssidan (ej kritiskt fel)"

      - name: Synka app-lista mot databasen
        run: |
          sudo -u shiny /usr/local/bin/synka_app_lista.sh || echo "Varning: kunde inte synka app-listan (ej kritiskt fel)"
